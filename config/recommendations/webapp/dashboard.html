<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Dashboard - Historical View</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --blue: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.6;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    h1 { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
    
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 10px;
    }
    .tab-btn {
      padding: 8px 16px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1em;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { 
      color: var(--blue); 
      border-bottom: 2px solid var(--blue);
    }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .card-label { color: var(--text-muted); font-size: 0.85em; margin-bottom: 4px; }
    .card-value { font-size: 1.5em; font-weight: 600; }
    .card-value.green { color: var(--green); }
    .card-value.red { color: var(--red); }
    .card-trend { font-size: 0.75em; color: var(--text-muted); margin-top: 4px; }
    
    .chart-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      height: 300px;
      position: relative;
    }
    
    canvas {
      max-width: 100%;
      max-height: 100%;
    }
    
    .period-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .period-btn {
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85em;
    }
    .period-btn:hover { border-color: var(--blue); }
    .period-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    
    .no-data {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
    
    @media (max-width: 768px) {
      .summary-cards { grid-template-columns: 1fr 1fr; }
      .chart-container { height: 250px; }
      h1 { font-size: 1.5em; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Portfolio Dashboard</h1>
    
    <div class="nav-tabs">
      <button class="tab-btn active" data-tab="performance">Performance</button>
      <button class="tab-btn" data-tab="recommendations">Recommendations</button>
    </div>
    
    <!-- Performance Tab -->
    <div class="tab-content active" id="performance">
      <div class="summary-cards">
        <div class="card">
          <div class="card-label">Current Value</div>
          <div class="card-value" id="currentValue">₹0</div>
          <div class="card-trend" id="valueTrend"></div>
        </div>
        <div class="card">
          <div class="card-label">Total P&L</div>
          <div class="card-value" id="totalPnL">₹0</div>
          <div class="card-trend" id="pnlTrend"></div>
        </div>
        <div class="card">
          <div class="card-label">Today's Change</div>
          <div class="card-value" id="todayChange">₹0</div>
          <div class="card-trend" id="changeTrend"></div>
        </div>
        <div class="card">
          <div class="card-label">Total Stocks</div>
          <div class="card-value" id="stockCount">0</div>
          <div class="card-trend" id="stockTrend"></div>
        </div>
      </div>
      
      <div class="period-selector">
        <button class="period-btn active" data-period="7">7D</button>
        <button class="period-btn" data-period="30">1M</button>
        <button class="period-btn" data-period="90">3M</button>
        <button class="period-btn" data-period="180">6M</button>
        <button class="period-btn" data-period="365">1Y</button>
        <button class="period-btn" data-period="all">All</button>
      </div>
      
      <div class="chart-container">
        <canvas id="performanceChart"></canvas>
      </div>
      
      <div class="chart-container">
        <canvas id="pnlChart"></canvas>
      </div>
    </div>
    
    <!-- Recommendations Tab -->
    <div class="tab-content" id="recommendations">
      <iframe src="index.html" style="width: 100%; height: 800px; border: none; border-radius: 8px;"></iframe>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    let historyData = null;
    let selectedPeriod = 7;
    let performanceChart = null;
    let pnlChart = null;
    
    function formatCurrency(n) {
      return '₹' + n.toLocaleString('en-IN', { maximumFractionDigits: 2 });
    }
    
    function loadHistory() {
      fetch('../automation/performance_history.json')
        .then(res => res.json())
        .then(data => {
          historyData = data;
          renderDashboard();
        })
        .catch(error => {
          console.error('Failed to load history:', error);
          document.getElementById('currentValue').parentElement.innerHTML = 
            '<div class="no-data">No historical data available.<br>Run: node config/automation/track-daily-performance.js</div>';
        });
    }
    
    function filterDataByPeriod(entries, days) {
      if (days === 'all') return entries;
      const cutoffDate = new Date();
      cutoffDate.setDate(cutoffDate.getDate() - days);
      return entries.filter(e => new Date(e.date) >= cutoffDate);
    }
    
    function renderDashboard() {
      if (!historyData || !historyData.entries || historyData.entries.length === 0) {
        return;
      }
      
      const entries = historyData.entries.sort((a, b) => new Date(a.date) - new Date(b.date));
      const latest = entries[entries.length - 1];
      const previous = entries.length > 1 ? entries[entries.length - 2] : latest;
      
      // Update summary cards
      document.getElementById('currentValue').textContent = formatCurrency(latest.totalCurrent);
      document.getElementById('currentValue').className = 'card-value';
      
      const pnlEl = document.getElementById('totalPnL');
      pnlEl.textContent = `${formatCurrency(latest.totalPnL)} (${latest.totalPnLPercent.toFixed(2)}%)`;
      pnlEl.className = 'card-value ' + (latest.totalPnL >= 0 ? 'green' : 'red');
      
      const todayChange = latest.totalCurrent - previous.totalCurrent;
      const todayChangePct = previous.totalCurrent > 0 ? (todayChange / previous.totalCurrent) * 100 : 0;
      const changeEl = document.getElementById('todayChange');
      changeEl.textContent = formatCurrency(todayChange);
      changeEl.className = 'card-value ' + (todayChange >= 0 ? 'green' : 'red');
      
      document.getElementById('stockCount').textContent = latest.stockCount;
      
      // Update trends
      document.getElementById('valueTrend').textContent = `${todayChangePct >= 0 ? '↑' : '↓'} ${Math.abs(todayChangePct).toFixed(2)}% today`;
      document.getElementById('pnlTrend').textContent = `${latest.totalPnLPercent >= 0 ? 'Profitable' : 'Loss'} portfolio`;
      document.getElementById('changeTrend').textContent = entries.length > 1 ? `vs yesterday` : 'First day';
      document.getElementById('stockTrend').textContent = `${entries.length} days tracked`;
      
      // Render charts
      renderCharts();
    }
    
    function renderCharts() {
      const entries = historyData.entries.sort((a, b) => new Date(a.date) - new Date(b.date));
      const filtered = filterDataByPeriod(entries, selectedPeriod);
      
      const labels = filtered.map(e => new Date(e.date).toLocaleDateString('en-IN', { month: 'short', day: 'numeric' }));
      const values = filtered.map(e => e.totalCurrent);
      const pnlValues = filtered.map(e => e.totalPnL);
      
      // Performance Chart
      const ctx1 = document.getElementById('performanceChart');
      if (performanceChart) performanceChart.destroy();
      
      performanceChart = new Chart(ctx1, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Portfolio Value',
            data: values,
            borderColor: '#58a6ff',
            backgroundColor: 'rgba(88, 166, 255, 0.1)',
            tension: 0.4,
            fill: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            title: {
              display: true,
              text: 'Portfolio Value Over Time',
              color: '#c9d1d9'
            }
          },
          scales: {
            y: {
              ticks: { color: '#8b949e', callback: (value) => '₹' + (value / 1000).toFixed(0) + 'k' },
              grid: { color: '#30363d' }
            },
            x: {
              ticks: { color: '#8b949e' },
              grid: { color: '#30363d' }
            }
          }
        }
      });
      
      // P&L Chart
      const ctx2 = document.getElementById('pnlChart');
      if (pnlChart) pnlChart.destroy();
      
      pnlChart = new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'P&L',
            data: pnlValues,
            backgroundColor: pnlValues.map(v => v >= 0 ? 'rgba(63, 185, 80, 0.6)' : 'rgba(248, 81, 73, 0.6)'),
            borderColor: pnlValues.map(v => v >= 0 ? '#3fb950' : '#f85149'),
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            title: {
              display: true,
              text: 'Profit & Loss Trend',
              color: '#c9d1d9'
            }
          },
          scales: {
            y: {
              ticks: { color: '#8b949e', callback: (value) => '₹' + (value / 1000).toFixed(0) + 'k' },
              grid: { color: '#30363d' }
            },
            x: {
              ticks: { color: '#8b949e' },
              grid: { color: '#30363d' }
            }
          }
        }
      });
    }
    
    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });
    
    // Period switching
    document.querySelectorAll('.period-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedPeriod = btn.dataset.period;
        renderCharts();
      });
    });
    
    // Load data on page load
    loadHistory();
  </script>
</body>
</html>
